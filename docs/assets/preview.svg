<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc"><title id="title">ATBL-SE loopback lab</title><desc id="desc">Client API connects to the local server, which exchanges WSS commands and binary scripts with a synthetic VacuGlide device. No cloud or hardware is connected.</desc><rect width="1080" height="400" rx="24" fill="#10151c"/><g font-family="sans-serif" fill="#e8edf4"><text x="48" y="62" font-size="32" font-weight="700">ATBL-SE</text><text x="48" y="94" font-size="16" fill="#aebac9">Offline control API and a synthetic loopback lab</text><g fill="#1a2330" stroke="#465970"><rect x="48" y="146" width="260" height="140" rx="16"/><rect x="410" y="146" width="260" height="140" rx="16"/><rect x="772" y="146" width="260" height="140" rx="16"/></g><g font-size="23" text-anchor="middle"><text x="178" y="188">API client</text><text x="540" y="188">Local server</text><text x="902" y="188">Virtual device</text></g><g font-size="15" text-anchor="middle" fill="#aebac9"><text x="178" y="222">SDK / Studio / panel</text><text x="178" y="250">local authentication</text><text x="540" y="222">Go core + script storage</text><text x="540" y="250">confirmed protocol replies</text><text x="902" y="222">speed / valves / scripts</text><text x="902" y="250">synthetic state only</text></g><g stroke="#70c9df" stroke-width="3"><path d="M318 216h76m-12-9 12 9-12 9M680 216h76m-12-9 12 9-12 9" fill="none"/></g><g fill="#70c9df" font-size="13" text-anchor="middle"><text x="356" y="201">HTTP</text><text x="718" y="201">WSS / TLS</text></g><text x="48" y="345" font-size="16" fill="#70c9df">vacuglide-simulator --lab</text><text x="48" y="373" font-size="14" fill="#aebac9">127.0.0.1 only · ephemeral data · no physical device · no cloud connection</text></g></svg>
